<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Toast's Commissions</title>
<style>
    :root {
        color-scheme: light only;
    }

    body {
        margin: 0;
        padding: 0;
        background-image: linear-gradient(#e6dac3, #e6dac3) !important;
        background-color: #e6dac3 !important; 
        color: #000 !important;
        font-family: sans-serif;
    }

    .main-wrapper {
        width: 100%;
        max-width: 900px; 
        margin: 0 auto !important; 
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        border-left: 2px solid #000 !important;
        border-right: 2px solid #000 !important;
        box-sizing: border-box; 
        background-image: linear-gradient(#e6dac3, #e6dac3) !important;
        background-color: #e6dac3 !important;
    }

    .sticky-header-wrapper {
        position: relative; 
        width: 100%;
    }

    .image-container {
        position: relative;
        width: 100%;
        display: block;
    }

    .toast-header {
        width: 100%;
        height: auto;
        display: block;
    }

    @keyframes idle-bob {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
    }

    .toast-character {
        position: absolute;
        bottom: -0.5%; 
        left: 28.5%; 
        width: 37.5%; 
        height: auto;
        z-index: 1; 
        animation: idle-bob 4s ease-in-out infinite;
    }

    .music-notes {
        position: absolute;
        top: 55%;  
        left: 4%;  
        width: 10%; 
        height: auto;
        z-index: 2;
        display: none; 
        pointer-events: none; 
    }

    /* --- VOLUME SLIDER --- */
    .volume-control {
        position: absolute;
        top: 98%; 
        left: 0.5%;
        width: 8%;
        z-index: 5;
        cursor: pointer;
    }

    .speech-bubble {
        position: absolute;
        top: 10%; 
        left: 64%; 
        width: 32%; 
        height: 32%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
        font-size: 20px;
        color: #222 !important;
        -webkit-text-fill-color: #222 !important;
        z-index: 2; 
        cursor: pointer;
        user-select: none;
        padding: 10px; 
        box-sizing: border-box;
    }

    .hotspot {
        position: absolute;
        display: block;
        transition: transform 0.2s ease;
        z-index: 3; 
    }

    .hotspot img {
        width: 100%;
        height: 100%;
        object-fit: contain; 
        display: block;
    }

    .hotspot:hover {
        transform: scale(1.1);
        cursor: pointer;
    }

    #spot-x        { top: 10%; left: 50.5%; width: 4%; height: 6.5%; }
    #spot-tg       { top: 10%; left: 55%; width: 4%; height: 6.5%; }
    #spot-fa       { top: 10%; left: 59.5%; width: 4%; height: 6.5%; }
    
    #spot-speaker  { top: 71%; left: 1%; width: 7%; height: 27%; }
    #spot-tips     { top: 68%; left: 8.5%; width: 10%; height: 30%; }
    #spot-plushie  { top: 68%; left: 17.5%; width: 8.5%; height: 30%; z-index: 4; }

    .dialogue-buttons {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 20px;
        background-image: linear-gradient(#e6dac3, #e6dac3) !important;
        background-color: #e6dac3 !important;
        width: 100%;
        box-sizing: border-box;
    }

    .action-btn {
        flex: 1; 
        padding: 15px;
        background-image: linear-gradient(#f4f4f4, #f4f4f4) !important;
        background-color: #f4f4f4 !important;
        border: 2px solid #000 !important;
        color: #000 !important;
        -webkit-text-fill-color: #000 !important;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: filter 0.2s ease; 
    }

    .action-btn:hover {
        filter: brightness(0.9); 
    }

    .dropdown-section {
        display: none; 
        width: 100%;
        padding: 0 20px 20px 20px;
        box-sizing: border-box;
        text-align: center;
        background-image: linear-gradient(#e6dac3, #e6dac3) !important;
        background-color: #e6dac3 !important;
    }

    .dropdown-section h2 {
        margin-top: 0;
        color: #000 !important;
        -webkit-text-fill-color: #000 !important;
    }

    .price-sheet {
        width: 100%;
        height: auto;
        border: 2px solid #000 !important;
        margin-bottom: 20px;
        box-sizing: border-box;
    }

    .trello-iframe {
        width: 100%;
        height: 600px;
        border: 2px solid #000 !important;
        border-radius: 5px;
        box-sizing: border-box;
        background-color: #fff; 
    }
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="sticky-header-wrapper">
        <div class="image-container">
            <img src="welcome!.png" alt="Room background" class="toast-header">
            <img src="toast.png" alt="Toast" class="toast-character">
            
            <img src="musicnotes.png" alt="Music Notes" class="music-notes" id="music-notes-img">
            
            <input type="range" id="volume-slider" class="volume-control" min="0" max="1" step="0.1" value="0.3">

            <div class="speech-bubble" id="toast-dialogue" onclick="advanceDialogue()" title="Click to skip">
                Loading...
            </div>

            <a href="https://x.com/NaLa_urBFF" class="hotspot" id="spot-x" title="Twitter/X" target="_blank">
                <img src="x.png" alt="Twitter">
            </a>
            <a href="https://t.me/NaLa_urBFF" class="hotspot" id="spot-tg" title="Telegram" target="_blank">
                <img src="tg.png" alt="Telegram">
            </a>
            <a href="https://www.furaffinity.net/user/nalaurbff/" class="hotspot" id="spot-fa" title="Furaffinity" target="_blank">
                <img src="fa.png" alt="Furaffinity">
            </a>
            
            <a class="hotspot" id="spot-speaker" title="Toggle Music">
                <img src="playlist.png" alt="Playlist">
            </a>
            <a href="#" class="hotspot" id="spot-tips" title="Tip Jar">
                <img src="tips.png" alt="Tip Jar">
            </a>
            <a href="#" class="hotspot" id="spot-plushie" title="Enzeru Plushie" onclick="revealCreator(event)">
                <img src="enzeru.png" alt="Enzeru Plushie">
            </a>
        </div>
    </div>

    <div class="dialogue-buttons" id="main-buttons">
        <button class="action-btn" onclick="toggleMenu('commission-dropdown')">I'd like a commission!</button>
        <button class="action-btn" onclick="toggleMenu('queue-dropdown')">I want to see the queue!</button>
        <button class="action-btn" onclick="window.open('https://t.me/enzeeeru', '_blank')">I'd like to make a complaint!</button>
    </div>

    <div id="commission-dropdown" class="dropdown-section">
        <h2>Contact me!</h2>
        <img src="pricesheet.png" alt="Nala's Price Sheet" class="price-sheet">
        <div class="dialogue-buttons" style="padding: 0;">
            <button class="action-btn" onclick="window.open('https://drive.google.com/drive/folders/1QZfq1hvozTjcMVbbSJmc0Fsrn5vAIn6t?usp=drive_link', '_blank')">Read the TOS</button>
            <button class="action-btn" onclick="window.open('https://t.me/enzeeeru', '_blank')">Contact Manager (Enzeru)</button>
        </div>
    </div>

    <div id="queue-dropdown" class="dropdown-section">
        <h2>Current Queue</h2>
        <iframe data-src="https://trello.com/b/HPq2AzLO.html" id="trello-frame" class="trello-iframe" frameborder="0"></iframe>
    </div>
</div>

<audio id="bg-music"></audio>

<script>
    // --- AUDIO SYSTEM ---
    const bgMusic = document.getElementById("bg-music");
    const musicNotes = document.getElementById("music-notes-img");
    const speakerBtn = document.getElementById("spot-speaker");
    const volSlider = document.getElementById("volume-slider");
    
    const playlist = [
        "prism-by-prigida.mp3",
        "sway-by-night-drift.mp3",
        "through-the-clouds-by-mountaineer.mp3"
    ];
    
    let isPlaying = false;
    
    // Set default volume low so it doesn't blast ears
    bgMusic.volume = 0.3;

    function playRandomTrack() {
        const randomTrack = playlist[Math.floor(Math.random() * playlist.length)];
        bgMusic.src = randomTrack;
        bgMusic.play().then(() => {
            isPlaying = true;
            musicNotes.style.display = "block";
        }).catch((error) => {
            isPlaying = false;
            musicNotes.style.display = "none";
        });
    }

    // Volume Slider Logic
    volSlider.oninput = function() {
        bgMusic.volume = this.value;
    };

    // The manual speaker button
    speakerBtn.onclick = function(event) {
        event.preventDefault(); 
        event.stopPropagation(); 
        
        if (isPlaying) {
            bgMusic.pause();
            musicNotes.style.display = "none";
            isPlaying = false;
        } else {
            playRandomTrack();
        }
    };

    // --- DIALOGUE SYSTEM ---
    const toastLines = [
        "Placeholder 1: Hello! My name is Toast.",
        "Placeholder 2: What can I do for you today?",
        "Placeholder 3: Check out the prices below!",
        "Placeholder 4: Don't forget to read the TOS.",
        "Placeholder 5: *vibing to the playlist*"
    ];
    
    let currentLine = 0;
    const dialogueElement = document.getElementById("toast-dialogue");

    function advanceDialogue() {
        currentLine = (currentLine + 1) % toastLines.length;
        dialogueElement.innerText = toastLines[currentLine];
    }

    dialogueElement.innerText = toastLines[0];
    setInterval(advanceDialogue, 5000);

    // --- MENU SYSTEM ---
    const originalButtons = `
        <button class="action-btn" onclick="toggleMenu('commission-dropdown')">I'd like a commission!</button>
        <button class="action-btn" onclick="toggleMenu('queue-dropdown')">I want to see the queue!</button>
        <button class="action-btn" onclick="window.open('https://t.me/enzeeeru', '_blank')">I'd like to make a complaint!</button>
    `;

    function toggleMenu(menuId) {
        var targetMenu = document.getElementById(menuId);
        var otherMenuId = (menuId === 'commission-dropdown') ? 'queue-dropdown' : 'commission-dropdown';
        var otherMenu = document.getElementById(otherMenuId);

        otherMenu.style.display = "none";

        if (targetMenu.style.display === "none" || targetMenu.style.display === "") {
            targetMenu.style.display = "block";
            if (menuId === 'queue-dropdown') {
                var trelloFrame = document.getElementById('trello-frame');
                if (!trelloFrame.src || trelloFrame.src === window.location.href) {
                    trelloFrame.src = trelloFrame.getAttribute('data-src');
                }
            }
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        } else {
            targetMenu.style.display = "none";
        }
    }

    function revealCreator(event) {
        if(event) event.preventDefault(); 
        var btnContainer = document.getElementById("main-buttons");
        document.getElementById("commission-dropdown").style.display = "none";
        document.getElementById("queue-dropdown").style.display = "none";
        
        if (btnContainer.innerHTML.includes("Page made by Enzeru!")) {
            btnContainer.innerHTML = originalButtons;
        } else {
            btnContainer.innerHTML = '<button class="action-btn" style="width: 100%; cursor: pointer;" onclick="revealCreator()">Page made by Enzeru! (Click to close)</button>';
        }
    }
</script>
</body>
</html>
